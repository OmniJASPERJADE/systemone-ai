name: System-One Source Build

on:
  push:
    branches: [master, main, ai/first-implementation]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build OmniVec-II
        run: |
          cmake -S Libraries/OmniVec-II \
            -B build/omnivec -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/omnivec

      - name: Test OmniVec-II
        run: ctest --test-dir build/omnivec --output-on-failure
